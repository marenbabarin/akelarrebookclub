<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Debug</title></head>
<body>
<pre id="out">Lädt...</pre>
<script>

fetch(CSV_URL)
  .then(r => r.text())

    const lines = text.split('\n').slice(0, 4);
    document.getElementById('out').textContent = 
      'RAW ERSTE 4 ZEILEN:\n\n' + lines.join('\n\n---\n\n');
  });
</script>
</body>
</html>
